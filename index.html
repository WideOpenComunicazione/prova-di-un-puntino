<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1570EF">
  <title>Un punto e basta? — Bozza interattiva Negen</title>
  <style>
    :root { --blue:#1570EF; --white:#fff; }
    * { box-sizing:border-box; }
    [hidden] { display:none !important; }
    html, body { margin:0; width:100%; min-height:100%; background:var(--blue); }
    body { font-family:Arial,Helvetica,sans-serif; -webkit-font-smoothing:antialiased; }
    button, a { font:inherit; }
    button { cursor:pointer; }
    #app {
      position:relative; isolation:isolate; width:100%; height:100dvh; min-height:560px;
      max-width:540px; margin:0 auto; overflow:hidden; color:var(--white);
      background:var(--blue); user-select:none; -webkit-user-select:none;
    }
    @media (min-width:541px) {
      body { display:grid; place-items:center; min-height:100vh; }
      #app { height:min(850px, 100dvh); border-left:1px solid var(--white); border-right:1px solid var(--white); }
    }
    .top {
      position:absolute; top:max(22px,env(safe-area-inset-top)); left:24px; right:24px;
      display:flex; align-items:center; justify-content:space-between; z-index:5;
      font-size:11px; font-weight:800; letter-spacing:.13em;
    }
    .sound {
      color:var(--white); background:none; border:1px solid var(--white); border-radius:999px;
      min-width:72px; padding:8px 10px; font-size:10px; letter-spacing:.05em;
    }
    #arena {
      position:absolute; inset:12% 0 23%; overflow:hidden; touch-action:none;
      -webkit-tap-highlight-color:transparent;
    }
    #shell {
      position:absolute; left:50%; top:50%; translate:-50% -50%; width:122px; height:122px;
      padding:0; background:var(--white); border:0; border-radius:3px;
      transition:transform .24s cubic-bezier(.2,.8,.2,1); touch-action:manipulation;
    }
    #shell:active { transform:scale(.95); }
    #shell svg { width:100%; height:100%; }
    #shell.shatter { animation:shatter .68s cubic-bezier(.35,0,.75,.35) forwards; pointer-events:none; }
    @keyframes shatter {
      0% { transform:scale(1) rotate(0); opacity:1; }
      30% { transform:scale(.89) rotate(-3deg); opacity:1; }
      58% { transform:scale(1.07) rotate(2deg); opacity:1; }
      100% { transform:scale(1.23) rotate(8deg); opacity:0; }
    }
    #shards { position:absolute; inset:0; pointer-events:none; }
    .shard {
      position:absolute; left:50%; top:50%; width:62px; height:62px; background:var(--white);
      opacity:0; animation:fly-shard 1.05s cubic-bezier(.16,.75,.28,1) forwards;
    }
    @keyframes fly-shard {
      0% { opacity:1; transform:translate(-50%,-50%) rotate(0); }
      100% { opacity:0; transform:translate(calc(-50% + var(--sx)),calc(-50% + var(--sy))) rotate(var(--rot)); }
    }
    #dot {
      position:absolute; left:50%; top:50%; width:92px; height:92px; padding:0;
      border:0; background:none; color:var(--blue); touch-action:none;
      transform:translate(-50%,-50%); z-index:4; -webkit-tap-highlight-color:transparent;
      transition:left .55s cubic-bezier(.18,.82,.2,1);
    }
    .dot-core {
      position:absolute; left:50%; top:50%; width:40px; height:40px; border-radius:50%;
      background:var(--white); transform:translate(-50%,-50%) scale(var(--scale,1));
      transition:transform .62s cubic-bezier(.18,1.13,.28,1); display:grid; place-items:center;
    }
    .face { width:60%; height:60%; opacity:0; overflow:visible; transition:opacity .35s ease; }
    #dot.sad .face, #dot.happy .face { opacity:1; }
    #dot.happy .sad-eye, #dot.sad .happy-eye { display:none; }
    #dot.born .dot-core { animation:birth .86s cubic-bezier(.18,.72,.22,1) backwards; }
    @keyframes birth {
      0% { transform:translate(-50%,-50%) scale(0); }
      45% { transform:translate(-50%,-50%) scale(1.23,.86); }
      70% { transform:translate(-50%,-50%) scale(.91,1.12); }
      100% { transform:translate(-50%,-50%) scale(1); }
    }
    #dot.flee { animation:flee 4.2s linear infinite; }
    @keyframes flee {
      0% { transform:translate(-50%,-50%) translate(0,0); animation-timing-function:cubic-bezier(.3,0,.4,1); }
      13%,17% { transform:translate(-50%,-50%) translate(-94px,-54px); }
      17% { animation-timing-function:cubic-bezier(.35,0,.45,1); }
      32%,36% { transform:translate(-50%,-50%) translate(89px,-79px); }
      36% { animation-timing-function:cubic-bezier(.32,0,.4,1); }
      51%,55% { transform:translate(-50%,-50%) translate(-70px,97px); }
      55% { animation-timing-function:cubic-bezier(.3,0,.45,1); }
      70%,74% { transform:translate(-50%,-50%) translate(102px,42px); }
      74% { animation-timing-function:cubic-bezier(.25,0,.4,1); }
      89%,92% { transform:translate(-50%,-50%) translate(-12px,-89px); }
      92% { animation-timing-function:cubic-bezier(.3,0,.4,1); }
      100% { transform:translate(-50%,-50%) translate(0,0); }
    }
    #dot.munch .dot-core { animation:munch .72s cubic-bezier(.18,.74,.25,1); }
    @keyframes munch {
      0%,100% { transform:translate(-50%,-50%) scale(var(--scale,1)); border-radius:50%; }
      30% { transform:translate(-50%,-50%) scale(var(--scale,1)) scaleX(.86) scaleY(1.17); border-radius:42% 58% 48% 52%; }
      62% { transform:translate(-50%,-50%) scale(var(--scale,1)) scaleX(1.15) scaleY(.91); border-radius:55% 45% 54% 46%; }
    }
    #dot.fill .dot-core { transition:transform 1.45s cubic-bezier(.38,.05,.13,1); transform:translate(-50%,-50%) scale(48) !important; }
    #reaction {
      position:absolute; left:0; right:0; top:15%; text-align:center; pointer-events:none;
      font-weight:900; font-size:clamp(22px,6vw,33px); letter-spacing:-.04em;
      opacity:0; transform:translateY(12px); transition:opacity .3s ease,transform .45s cubic-bezier(.2,.8,.2,1);
    }
    #reaction.visible { opacity:1; transform:translateY(0); }
    #drawCanvas {
      position:absolute; inset:0; width:100%; height:100%; z-index:3; touch-action:none;
      transform-origin:68% 50%; transition:opacity .46s ease, transform .6s cubic-bezier(.2,.8,.2,1);
    }
    #drawCanvas.eaten { opacity:0; transform:translateX(18%) scale(.62); }
    .copy {
      position:absolute; left:26px; right:26px; bottom:max(49px,env(safe-area-inset-bottom));
      min-height:120px; text-align:center; z-index:6; pointer-events:none;
    }
    #headline { margin:0 0 11px; font-size:clamp(25px,6.5vw,36px); line-height:1.06; letter-spacing:-.055em; font-weight:900; }
    #subline { margin:0; font-size:14px; font-weight:400; line-height:1.4; opacity:.92; }
    .progress { margin:29px auto 0; display:flex; gap:5px; justify-content:center; }
    .progress i { width:18px; height:3px; border-radius:3px; border:1px solid var(--white); }
    .progress i.on { background:var(--white); }
    #end {
      position:absolute; inset:0; background:var(--white); color:var(--blue); z-index:10;
      display:flex; flex-direction:column; justify-content:center; align-items:center;
      text-align:center; padding:30px; opacity:0; visibility:hidden;
      transition:opacity .68s ease,visibility .68s;
    }
    #end.visible { opacity:1; visibility:visible; }
    #end .end-content { transform:translateY(18px); opacity:0; transition:transform .8s cubic-bezier(.2,.85,.2,1),opacity .65s ease; }
    #end.visible .end-content { transform:translateY(0); opacity:1; }
    #end .powered { font-size:16px; font-weight:700; letter-spacing:.015em; }
    #end h2 { font-size:clamp(55px,15vw,88px); font-weight:900; letter-spacing:-.09em; margin:6px 0 35px; line-height:.95; }
    #end a, #restart {
      display:inline-flex; justify-content:center; align-items:center; min-height:48px;
      text-decoration:none; background:var(--blue); border:2px solid var(--blue);
      color:var(--white); border-radius:100px; padding:13px 25px; font-weight:800;
    }
    #restart { margin-top:15px; background:var(--white); color:var(--blue); }
    #linkHint { margin-top:14px; font-size:12px; max-width:260px; }
    @media (prefers-reduced-motion:reduce) {
      #dot.flee { animation-duration:5s; }
      #dot.fill .dot-core { transition-duration:.25s; }
      #shell.shatter, .shard { animation-duration:.25s; }
      #drawCanvas, #end, #end .end-content { transition-duration:.2s; }
    }
  </style>
</head>
<body>
<main id="app">
  <header class="top"><span>UN PUNTO E BASTA?</span><button id="sound" class="sound" type="button">SUONO ON</button></header>
  <section id="arena" aria-label="Area di gioco">
    <button id="shell" type="button" aria-label="Tocca il quadrato per aprirlo">
      <svg viewBox="0 0 122 122" aria-hidden="true"><path id="cracks" fill="none" stroke="#1570EF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div id="shards"></div>
    <button id="dot" type="button" aria-label="Puntino" hidden>
      <span class="dot-core">
        <svg class="face" viewBox="0 0 40 40" aria-hidden="true">
          <g class="sad-eye" stroke="#1570EF" stroke-width="2.7" stroke-linecap="round" fill="none">
            <path d="M8 18l7 3M32 18l-7 3"/><path d="M15 32q5 -5 10 0"/>
          </g>
          <g class="happy-eye" stroke="#1570EF" stroke-width="2.7" stroke-linecap="round" fill="none">
            <path d="M8 18q4 -5 8 0M24 18q4 -5 8 0"/><path d="M13 26q7 10 14 0"/>
          </g>
        </svg>
      </span>
    </button>
    <canvas id="drawCanvas" hidden aria-label="Disegna con il dito"></canvas>
    <div id="reaction" aria-live="polite"></div>
  </section>
  <div class="copy" aria-live="polite">
    <h1 id="headline">TOCCA IL QUADRATO.</h1>
    <p id="subline">Tap, tap, tap…</p>
    <div class="progress" id="progress" aria-hidden="true"></div>
  </div>
  <section id="end" aria-label="Fine dell'esperienza">
    <div class="end-content">
      <div class="powered">powered by</div>
      <h2>Negen.</h2>
      <a id="instagram" href="#">SCOPRICI QUI ↗</a>
      <div><button id="restart" type="button">RIGIOCA ↺</button></div>
      <div id="linkHint" aria-live="polite"></div>
    </div>
  </section>
</main>
<script>
(() => {
  'use strict';

  // Inserisci qui l'URL esatto del profilo Instagram Negen quando sarà pronto.
  const INSTAGRAM_URL = '';

  const $ = id => document.getElementById(id);
  const arena = $('arena'), shell = $('shell'), shards = $('shards'), dot = $('dot');
  const headline = $('headline'), subline = $('subline'), reaction = $('reaction');
  const canvas = $('drawCanvas'), ctx = canvas.getContext('2d');
  const soundBtn = $('sound');
  const stepIndex = { crack:0, drag:1, falling:1, escape:2, sad:2, fly:3, flying:3, feed:4, eating:4, zoom:5, end:5 };
  const sequence = ['crack','drag','escape','fly','feed','zoom'];
  let phase = 'crack', taps = 0, throws = 0, flights = 0, meals = 0;
  let drag = null, flyTouch = null, drawTouch = null, drawDistance = 0;
  let pointers = new Map(), pinchStart = 0, holdTimer = null, holdPointer = null;
  let soundOn = true, audio = null, reactionTimer = null;
  const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function copy(title, subtitle='') {
    headline.textContent=title; subline.textContent=subtitle;
    [headline,subline].forEach((el,i)=>{
      el.getAnimations().forEach(a=>a.cancel());
      el.animate([
        {opacity:0,transform:'translateY(11px)'},
        {opacity:1,transform:'translateY(0)'}
      ],{duration:reducedMotion?130:390+i*100,easing:'cubic-bezier(.18,.8,.22,1)'});
    });
  }
  function progress() {
    $('progress').innerHTML=sequence.map((s,i)=>`<i class="${i<=stepIndex[phase]?'on':''}"></i>`).join('');
  }
  function setPhase(next) { phase=next; progress(); }
  function showReaction(label, ms=650) {
    clearTimeout(reactionTimer);
    reaction.textContent=label; reaction.classList.add('visible');
    reactionTimer=setTimeout(()=>reaction.classList.remove('visible'),ms);
  }
  function tone(freq=420, duration=.12, kind='sine', delay=0, volume=.08) {
    if (!soundOn) return;
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      audio ||= new AudioContextClass();
      if (audio.state==='suspended') audio.resume();
      const osc=audio.createOscillator(), gain=audio.createGain(), at=audio.currentTime+delay;
      osc.type=kind; osc.frequency.setValueAtTime(freq,at);
      gain.gain.setValueAtTime(.0001,at);
      gain.gain.exponentialRampToValueAtTime(volume,at+.012);
      gain.gain.exponentialRampToValueAtTime(.0001,at+duration);
      osc.connect(gain).connect(audio.destination); osc.start(at); osc.stop(at+duration+.01);
    } catch (_) { /* L'esperienza funziona anche senza audio. */ }
  }
  function sadSound() { tone(380,.25,'sine',0,.065); tone(250,.32,'sine',.18,.06); }
  function happySound() { tone(440,.13,'sine'); tone(660,.17,'sine',.11); tone(880,.23,'sine',.23); }
  function origin() { dot.style.transform='translate(-50%,-50%)'; }
  function scale(value) { dot.style.setProperty('--scale',value); }
  function move(dx,dy) { dot.style.transform=`translate(-50%,-50%) translate(${dx}px,${dy}px)`; }

  soundBtn.addEventListener('click', () => {
    soundOn=!soundOn; soundBtn.textContent=soundOn?'SUONO ON':'SUONO OFF';
    if (soundOn) tone(660);
  });

  // 1. Il quadrato si incrina e libera il puntino.
  const crackStages = [
    '',
    'M58 0L64 23L53 43',
    'M58 0L64 23L53 43L66 64L47 86L54 122',
    'M58 0L64 23L53 43L66 64L47 86L54 122M53 43L25 51L0 43M66 64L97 48L122 55',
    'M58 0L64 23L53 43L66 64L47 86L54 122M53 43L25 51L0 43M66 64L97 48L122 55M47 86L20 100M97 48L103 19'
  ];
  shell.addEventListener('click', () => {
    if (phase!=='crack') return;
    taps=Math.min(4,taps+1); $('cracks').setAttribute('d',crackStages[taps]);
    tone(210+taps*95,.1,'triangle');
    shell.animate([
      {transform:'scale(1)'},
      {transform:'scale(.94)',offset:.36},
      {transform:'scale(1.025)',offset:.7},
      {transform:'scale(1)'}
    ],{duration:reducedMotion?100:260,easing:'cubic-bezier(.2,.75,.25,1)'});
    if (taps<4) return;
    setPhase('drag'); copy('OH!', 'È uscito qualcosa…');
    shell.classList.add('shatter');
    const pieces=[[-95,-100,'-42deg'],[100,-90,'52deg'],[-100,100,'18deg'],[95,100,'-27deg']];
    pieces.forEach(([x,y,r],i)=>{
      const p=document.createElement('i'); p.className='shard';
      p.style.setProperty('--sx',`${x}px`); p.style.setProperty('--sy',`${y}px`);
      p.style.setProperty('--rot',r); p.style.animationDelay=`${i*35}ms`;
      p.style.clipPath=i===0?'polygon(0 0,100% 0,70% 100%)':i===1?'polygon(0 0,100% 0,100% 100%)':i===2?'polygon(0 0,100% 0,0 100%)':'polygon(0 0,100% 35%,100% 100%,0 100%)';
      shards.appendChild(p);
    });
    setTimeout(()=>{
      shell.hidden=true; shards.innerHTML=''; dot.hidden=false;
      dot.classList.add('born'); tone(570,.16); tone(820,.22,'sine',.12);
      setTimeout(()=>{ dot.classList.remove('born'); copy('PORTALO SU.', 'Trascina il puntino verso l’alto.'); },900);
    },620);
  });

  // 2. Trascina, lascia cadere, poi il puntino si ribella.
  dot.addEventListener('pointerdown', e => {
    if (phase==='drag') {
      e.preventDefault(); dot.setPointerCapture(e.pointerId);
      drag={id:e.pointerId,x:e.clientX,y:e.clientY,dx:0,dy:0};
    } else if (phase==='escape') {
      e.preventDefault(); catchDot();
    } else if (phase==='zoom') {
      e.preventDefault(); clearTimeout(holdTimer);
      holdPointer={id:e.pointerId,x:e.clientX,y:e.clientY};
      holdTimer=setTimeout(finish,850);
    }
  });
  dot.addEventListener('pointermove', e => {
    if (phase==='zoom' && holdPointer?.id===e.pointerId &&
        Math.hypot(e.clientX-holdPointer.x,e.clientY-holdPointer.y)>12) {
      clearTimeout(holdTimer); holdPointer=null;
    }
    if (!drag || drag.id!==e.pointerId || phase!=='drag') return;
    drag.dx=Math.max(-130,Math.min(130,e.clientX-drag.x));
    drag.dy=Math.max(-190,Math.min(120,e.clientY-drag.y));
    move(drag.dx,drag.dy);
  });
  function releaseDrag(e) {
    clearTimeout(holdTimer);
    if (holdPointer?.id===e.pointerId) holdPointer=null;
    if (!drag || drag.id!==e.pointerId || phase!=='drag') return;
    const {dx,dy}=drag; drag=null;
    if (dy > -35) { origin(); return; }
    setPhase('falling');
    dot.animate([
      {transform:`translate(-50%,-50%) translate(${dx}px,${dy}px)`,offset:0,easing:'cubic-bezier(.2,.5,.42,1)'},
      {transform:`translate(-50%,-50%) translate(${dx*.55}px,${dy-24}px) scale(.96,1.08)`,offset:.18,easing:'cubic-bezier(.48,0,.82,.66)'},
      {transform:'translate(-50%,-50%) translate(0px,88px) scale(1.2,.8)',offset:.64,easing:'cubic-bezier(.12,.8,.28,1)'},
      {transform:'translate(-50%,-50%) translate(0px,-24px) scale(.95,1.05)',offset:.8,easing:'cubic-bezier(.48,0,.75,.85)'},
      {transform:'translate(-50%,-50%) translate(0px,0px)',offset:1}
    ],{duration:reducedMotion?400:1220,fill:'none'});
    origin(); tone(190,.2,'triangle',reducedMotion?.15:.7);
    throws++;
    setTimeout(()=>{
      if (phase!=='falling') return;
      if (throws===1) { setPhase('drag'); copy('OPS. È CADUTO.', 'Riprova a tirarlo su.'); return; }
      dot.animate([
        {transform:'translate(-50%,-50%) rotate(0deg)'},
        {transform:'translate(-50%,-50%) rotate(-12deg)',offset:.25},
        {transform:'translate(-50%,-50%) rotate(11deg)',offset:.55},
        {transform:'translate(-50%,-50%) rotate(0deg)'}
      ],{duration:reducedMotion?120:500,easing:'ease-in-out'});
      setPhase('escape'); copy('ACCHIAPPALO!', 'Adesso è lui che scappa.');
      setTimeout(()=>{
        if (phase!=='escape') return;
        dot.classList.add('flee'); tone(710,.1); tone(880,.1,'sine',.12);
      },reducedMotion?120:460);
    },reducedMotion?420:1240);
  }
  dot.addEventListener('pointerup', releaseDrag);
  dot.addEventListener('pointercancel', releaseDrag);
  dot.addEventListener('pointerleave', () => { if (phase==='zoom') clearTimeout(holdTimer); });

  // 3. La cattura lo rende triste; l'utente lo aiuta a volare.
  function catchDot() {
    if (phase!=='escape') return;
    setPhase('sad');
    const where=getComputedStyle(dot).transform;
    dot.classList.remove('flee'); dot.style.transform=where;
    dot.animate([
      {transform:where,easing:'cubic-bezier(.18,.72,.25,1)'},
      {transform:'translate(-50%,-50%)'}
    ],{duration:reducedMotion?150:580});
    setTimeout(()=>origin(),reducedMotion?150:580);
    setTimeout(()=>{
      if (phase!=='sad') return;
      dot.classList.remove('happy'); dot.classList.add('sad');
      copy('OH NO. È TRISTE.', 'Forse non voleva essere preso.'); sadSound();
    },reducedMotion?100:470);
    setTimeout(()=>{ if (phase==='sad') { setPhase('fly'); copy('FALLO VOLARE!', 'Scorri verso l’alto sullo schermo.'); } },reducedMotion?1100:2100);
  }

  // 4. Uno swipe verso l'alto crea un piccolo volo.
  arena.addEventListener('pointerdown', e => {
    if (phase==='fly') flyTouch={id:e.pointerId,y:e.clientY};
    if (phase==='zoom') {
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if (pointers.size===2) {
        clearTimeout(holdTimer); holdPointer=null;
        pinchStart=distance([...pointers.values()]);
      }
    }
  });
  arena.addEventListener('pointermove', e => {
    if (phase!=='zoom' || !pointers.has(e.pointerId)) return;
    pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if (pointers.size===2 && distance([...pointers.values()])>pinchStart+45) finish();
  });
  arena.addEventListener('pointerup', e => {
    if (phase==='fly' && flyTouch?.id===e.pointerId) {
      if (e.clientY-flyTouch.y < -55) flyOnce();
      flyTouch=null;
    }
    pointers.delete(e.pointerId);
    if (pointers.size<2) pinchStart=0;
  });
  arena.addEventListener('pointercancel', e=>{
    pointers.delete(e.pointerId); flyTouch=null; clearTimeout(holdTimer);
  });
  function flyOnce() {
    if (phase!=='fly') return;
    setPhase('flying'); // blocca swipes ripetuti durante il volo
    const height=Math.min(195,arena.clientHeight*.38);
    dot.animate([
      {transform:'translate(-50%,-50%) translateY(0) scale(1.1,.9)',offset:0,easing:'cubic-bezier(.15,.7,.4,1)'},
      {transform:`translate(-50%,-50%) translateY(${-height}px) scale(.9,1.12)`,offset:.31,easing:'cubic-bezier(.37,0,.68,.75)'},
      {transform:'translate(-50%,-50%) translateY(74px) scale(1.18,.82)',offset:.65,easing:'cubic-bezier(.16,.8,.3,1)'},
      {transform:'translate(-50%,-50%) translateY(-38px) scale(.97,1.03)',offset:.82,easing:'cubic-bezier(.42,0,.68,.7)'},
      {transform:'translate(-50%,-50%) translateY(0)',offset:1}
    ],{duration:reducedMotion?420:1730});
    setTimeout(()=>{
      if (phase!=='flying') return;
      dot.classList.remove('sad'); dot.classList.add('happy');
      showReaction('YUPIIII!',850); happySound();
    },reducedMotion?100:330);
    flights++;
    setTimeout(()=>{
      if (flights>=2) beginFeed();
      else { setPhase('fly'); copy('ANCORA!', 'Un altro swipe verso l’alto.'); }
    },reducedMotion?450:1770);
  }

  // 5. Disegna un piccolo scarabocchio: il puntino lo mangia e cresce.
  function sizeCanvas() {
    const rect=arena.getBoundingClientRect(), dpr=Math.min(devicePixelRatio||1,2);
    canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.lineWidth=5; ctx.strokeStyle='#fff'; ctx.lineCap='round'; ctx.lineJoin='round';
  }
  function beginFeed() {
    setPhase('feed'); origin(); dot.classList.add('happy');
    copy('HA FAME!', 'Disegnagli qualcosa con un dito.');
    dot.style.left='68%'; canvas.hidden=false; canvas.classList.remove('eaten'); sizeCanvas();
  }
  function canvasPoint(e) { const r=canvas.getBoundingClientRect(); return {x:e.clientX-r.left,y:e.clientY-r.top}; }
  canvas.addEventListener('pointerdown',e=>{
    if (phase!=='feed') return;
    e.preventDefault(); canvas.setPointerCapture(e.pointerId);
    const p=canvasPoint(e); drawTouch={id:e.pointerId,last:p}; drawDistance=0;
    ctx.beginPath(); ctx.moveTo(p.x,p.y);
  });
  canvas.addEventListener('pointermove',e=>{
    if (!drawTouch || e.pointerId!==drawTouch.id || phase!=='feed') return;
    const p=canvasPoint(e); drawDistance+=Math.hypot(p.x-drawTouch.last.x,p.y-drawTouch.last.y);
    drawTouch.last=p; ctx.lineTo(p.x,p.y); ctx.stroke();
  });
  function stopDrawing(e) {
    if (!drawTouch || e.pointerId!==drawTouch.id || phase!=='feed') return;
    drawTouch=null;
    if (drawDistance<35) { ctx.clearRect(0,0,canvas.width,canvas.height); return; }
    setPhase('eating'); canvas.classList.add('eaten'); showReaction('GNAM!',850);
    tone(310,.12,'triangle'); tone(220,.14,'triangle',.12);
    dot.classList.add('munch'); meals++;
    setTimeout(()=>{
      scale(1+meals*.48); dot.classList.remove('munch');
      ctx.clearRect(0,0,canvas.width,canvas.height); canvas.classList.remove('eaten');
      if (meals>=2) {
        canvas.hidden=true; dot.style.left='50%';
        setPhase('zoom'); copy('ORA È ENORME.', 'Allarga con due dita oppure tienilo premuto.');
        happySound();
      } else { setPhase('feed'); copy('GLI PIACE!', 'Disegnagli ancora qualcosa.'); }
    },reducedMotion?450:880);
  }
  canvas.addEventListener('pointerup',stopDrawing);
  canvas.addEventListener('pointercancel',stopDrawing);

  // 6. Pinch-out o pressione prolungata: il puntino riempie lo schermo.
  function distance(points) { return Math.hypot(points[0].x-points[1].x,points[0].y-points[1].y); }
  function finish() {
    if (phase!=='zoom') return;
    setPhase('end'); clearTimeout(holdTimer); holdPointer=null; pointers.clear();
    dot.classList.add('fill'); copy('', ''); happySound();
    setTimeout(()=>$('end').classList.add('visible'),reducedMotion?260:1250);
  }
  $('instagram').addEventListener('click',e=>{
    if (INSTAGRAM_URL) { e.currentTarget.href=INSTAGRAM_URL; return; }
    e.preventDefault(); $('linkHint').textContent='Inserisci il link Instagram nella costante INSTAGRAM_URL del codice.';
  });
  $('restart').addEventListener('click',()=>location.reload());
  document.addEventListener('keydown',e=>{
    if (phase==='fly' && e.key==='ArrowUp') flyOnce();
    if (phase==='zoom' && (e.key==='Enter'||e.key===' ')) { e.preventDefault(); finish(); }
  });
  window.addEventListener('resize',()=>{ if (phase==='feed') sizeCanvas(); });
  progress();
})();
</script>
</body>
</html>
